name: Build and publish MaterialCraft Web

on:
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: "Official MaterialCraft release tag (empty = latest)"
        required: false
        type: string
      force_rebuild:
        description: "Rebuild an already published upstream release"
        required: false
        default: false
        type: boolean

  schedule:
    # Check for new official upstream releases every day at 03:47 UTC.
    - cron: "47 3 * * *"

  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-image.yml"
      - "Dockerfile"
      - "nginx.conf"
      - ".dockerignore"
      - "docker-compose.yml"
      - "README.md"

permissions:
  contents: write
  packages: write

concurrency:
  group: materialcraft-web-publish
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/mikapst/materialcraft-web

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      # 1. Keep the packaging repository separate from official upstream code.
      - name: Check out version-controlled packaging repository
        uses: actions/checkout@v4
        with:
          path: packaging

      - name: Validate required packaging files
        shell: bash
        run: |
          set -euo pipefail
          for file in Dockerfile nginx.conf .dockerignore docker-compose.yml README.md; do
            test -s "packaging/$file"
          done
          echo "Independent MaterialCraft Docker packaging validated."

      # 2. Resolve an official GitHub Release, never the moving upstream main branch.
      - name: Resolve official MaterialCraft release
        id: release
        uses: actions/github-script@v7
        env:
          REQUESTED_TAG: ${{ inputs.upstream_tag }}
        with:
          script: |
            const requested = (process.env.REQUESTED_TAG || '').trim();
            const params = {owner: 'storytold', repo: 'materialcraft'};
            const {data: release} = requested
              ? await github.rest.repos.getReleaseByTag({...params, tag: requested})
              : await github.rest.repos.getLatestRelease(params);
            if (!release.tag_name) throw new Error('Official release has no tag');
            core.setOutput('tag', release.tag_name);
            core.setOutput('name', release.name || `MaterialCraft ${release.tag_name}`);
            core.setOutput('url', release.html_url);
            core.setOutput('prerelease', String(release.prerelease));
            core.setOutput('published_at', release.published_at || '');

      # 3. Idempotent scheduled builds, but always rebuild on monitored packaging pushes.
      - name: Check existing MikaPST GitHub Release
        id: check
        uses: actions/github-script@v7
        env:
          UPSTREAM_TAG: ${{ steps.release.outputs.tag }}
          FORCE_REBUILD: ${{ inputs.force_rebuild }}
        with:
          script: |
            let exists = false;
            try {
              await github.rest.repos.getReleaseByTag({
                ...context.repo, tag: process.env.UPSTREAM_TAG
              });
              exists = true;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            const forced = process.env.FORCE_REBUILD === 'true' || context.eventName === 'push';
            core.setOutput('skip', String(exists && !forced));
            core.info(exists && !forced ? 'Release already packaged; skipping.' : 'Build required.');

      # 4. Exact official upstream tag, plus separately versioned font assets.
      - name: Check out official MaterialCraft source
        if: steps.check.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          repository: storytold/materialcraft
          ref: ${{ steps.release.outputs.tag }}
          path: upstream
          fetch-depth: 1

      - name: Check out shared Craft fonts
        if: steps.check.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          repository: storytold/craft-fonts
          ref: main
          path: craft-fonts
          fetch-depth: 1

      - name: Validate upstream source and legal notices
        if: steps.check.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          for file in Cargo.toml Cargo.lock apps/materialcraft-web/Trunk.toml \
                      apps/materialcraft-web/index.html LICENSE-MIT LICENSE-APACHE \
                      NOTICE ATTRIBUTION.md; do
            test -s "upstream/$file"
          done
          test -d craft-fonts/fonts
          grep -q 'data-cargo-profile="wasm-release"' upstream/apps/materialcraft-web/index.html
          echo "Validated official WASM release build profile and source files."

      - name: Record exact source revisions
        if: steps.check.outputs.skip != 'true'
        id: source
        shell: bash
        run: |
          set -euo pipefail
          echo "upstream_sha=$(git -C upstream rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "upstream_short=$(git -C upstream rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"
          echo "fonts_sha=$(git -C craft-fonts rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # 5. Compile the official Rust/Trunk WebAssembly build ONCE on the runner.
      - name: Install Rust and WebAssembly target
        if: steps.check.outputs.skip != 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.96.1"
          targets: wasm32-unknown-unknown

      - name: Cache Rust build artifacts
        if: steps.check.outputs.skip != 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "upstream -> upstream/target"

      - name: Install Trunk
        if: steps.check.outputs.skip != 'true'
        shell: bash
        run: cargo install trunk --locked

      - name: Build official MaterialCraft WebAssembly application
        if: steps.check.outputs.skip != 'true'
        working-directory: upstream/apps/materialcraft-web
        env:
          CRAFT_FONTS_DIR: ${{ github.workspace }}/craft-fonts
          CARGO_BUILD_JOBS: "2"
        shell: bash
        run: |
          set -euo pipefail
          # index.html selects Cargo's optimized `wasm-release` profile.
          trunk build --release
          test -s ../../dist/web/index.html

      # 6. The official web package enforces a 24 MiB max per WASM asset.
      - name: Validate static assets and upstream WebAssembly size gate
        if: steps.check.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          site=upstream/dist/web
          test -s "$site/index.html"
          wasm=("$site"/*.wasm)
          js=("$site"/*.js)
          test "${#wasm[@]}" -gt 0 || { echo "::error::No WASM output"; exit 1; }
          test "${#js[@]}" -gt 0 || { echo "::error::No JS output"; exit 1; }
          if grep -Eq '(src|href)="/[^/]' "$site/index.html"; then
            echo "::error::Absolute application URLs found in index.html"; exit 1
          fi
          for asset in "${wasm[@]}"; do
            bytes=$(wc -c < "$asset" | tr -d ' ')
            echo "$(basename "$asset"): $bytes bytes"
            if (( bytes > 25165824 )); then
              echo "::error::WASM asset exceeds official 24 MiB web package limit: $asset"
              exit 1
            fi
          done

      # 7. Assemble a minimal static runtime and retain required notices.
      - name: Prepare versioned Docker build context
        if: steps.check.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docker-context/site docker-context/legal
          cp -a upstream/dist/web/. docker-context/site/
          cp packaging/Dockerfile packaging/nginx.conf packaging/.dockerignore docker-context/
          for f in LICENSE-MIT LICENSE-APACHE NOTICE ATTRIBUTION.md; do
            cp "upstream/$f" docker-context/legal/
          done
          # Preserve notices for shared fonts embedded during the Rust build.
          shopt -s nullglob
          for f in craft-fonts/fonts/*/OFL.txt; do
            family=$(basename "$(dirname "$f")")
            cp "$f" "docker-context/legal/OFL-$family.txt"
          done
          if [ -s craft-fonts/ATTRIBUTION.md ]; then
            cp craft-fonts/ATTRIBUTION.md docker-context/legal/CRAFT-FONTS-ATTRIBUTION.md
          fi
          test -s docker-context/site/index.html
          test -s docker-context/legal/NOTICE
          echo "Static assets, upstream notices and fonts attributions staged."

      - name: Set up QEMU
        if: steps.check.outputs.skip != 'true'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: steps.check.outputs.skip != 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: steps.check.outputs.skip != 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Docker image tags
        if: steps.check.outputs.skip != 'true'
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.release.outputs.tag }}
            type=raw,value=upstream-${{ steps.source.outputs.upstream_short }}

      - name: Build and publish multi-platform image
        if: steps.check.outputs.skip != 'true'
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./docker-context
          file: ./docker-context/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: |
            org.opencontainers.image.title=MaterialCraft Web
            org.opencontainers.image.description=Community-maintained MaterialCraft WebAssembly image
            org.opencontainers.image.source=https://github.com/storytold/materialcraft
            org.opencontainers.image.version=${{ steps.release.outputs.tag }}
            org.opencontainers.image.revision=${{ steps.source.outputs.upstream_sha }}
          build-args: |
            MATERIALCRAFT_COMMIT=${{ steps.source.outputs.upstream_sha }}
            CRAFT_FONTS_COMMIT=${{ steps.source.outputs.fonts_sha }}
            MATERIALCRAFT_VERSION=${{ steps.release.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 8. Publish the matching release ONLY after Buildx has pushed successfully.
      - name: Create or update matching GitHub Release
        if: steps.check.outputs.skip != 'true'
        uses: actions/github-script@v7
        env:
          UPSTREAM_TAG: ${{ steps.release.outputs.tag }}
          UPSTREAM_NAME: ${{ steps.release.outputs.name }}
          UPSTREAM_URL: ${{ steps.release.outputs.url }}
          UPSTREAM_PUBLISHED_AT: ${{ steps.release.outputs.published_at }}
          UPSTREAM_PRERELEASE: ${{ steps.release.outputs.prerelease }}
          UPSTREAM_SHA: ${{ steps.source.outputs.upstream_sha }}
          UPSTREAM_SHORT: ${{ steps.source.outputs.upstream_short }}
          FONTS_SHA: ${{ steps.source.outputs.fonts_sha }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        with:
          script: |
            const tag = process.env.UPSTREAM_TAG;
            const image = 'ghcr.io/mikapst/materialcraft-web';
            const {data: upstream} = await github.rest.repos.getReleaseByTag({
              owner: 'storytold', repo: 'materialcraft', tag
            });
            const body = [
              `This release packages **${process.env.UPSTREAM_NAME}** as a community-maintained Docker image.`,
              '',
              '## Docker image',
              `- \`${image}:latest\``,
              `- \`${image}:${tag}\``,
              `- \`${image}:upstream-${process.env.UPSTREAM_SHORT}\``,
              '',
              'Supported platforms: `linux/amd64`, `linux/arm64`.',
              `Docker manifest digest: \`${process.env.IMAGE_DIGEST || 'not reported'}\``,
              '',
              '## Official upstream release',
              `- **Release:** [${process.env.UPSTREAM_NAME}](${process.env.UPSTREAM_URL})`,
              `- **Tag:** \`${tag}\``,
              `- **Published upstream:** ${process.env.UPSTREAM_PUBLISHED_AT || 'not specified'}`,
              `- **Source commit:** \`${process.env.UPSTREAM_SHA}\``,
              `- **Craft fonts commit:** \`${process.env.FONTS_SHA}\` (from its main branch)`,
              '',
              '## Upstream release notes',
              upstream.body || 'No upstream release notes provided.',
              '',
              '## Packaging',
              '- Dockerfile, nginx.conf and .dockerignore maintained in MikaPST/materialcraft-web.',
              '- Upstream static web app compiled once and packaged for AMD64/ARM64.',
              '- Independent community Docker packaging; not an official MaterialCraft release.'
            ].join('\n');

            let existing;
            try {
              ({data: existing} = await github.rest.repos.getReleaseByTag({
                ...context.repo, tag
              }));
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            const args = {
              ...context.repo,
              tag_name: tag,
              name: `MaterialCraft Web ${tag}`,
              body,
              draft: false,
              prerelease: process.env.UPSTREAM_PRERELEASE === 'true'
            };
            if (existing) {
              await github.rest.repos.updateRelease({...args, release_id: existing.id});
              core.info(`Updated release ${tag}`);
            } else {
              await github.rest.repos.createRelease({...args, target_commitish: context.sha});
              core.info(`Created release ${tag}`);
            }
