# MaterialCraft Web — independent, version-controlled NGINX configuration.
# WebAssembly runs in the browser. Never proxy document/material data to a backend.
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    server_tokens off;

    # Writable paths for USER nginx in the Dockerfile.
    client_body_temp_path /tmp/nginx_client_temp;
    proxy_temp_path       /tmp/nginx_proxy_temp;
    fastcgi_temp_path     /tmp/nginx_fastcgi_temp;
    uwsgi_temp_path      /tmp/nginx_uwsgi_temp;
    scgi_temp_path       /tmp/nginx_scgi_temp;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types application/wasm text/javascript application/javascript text/css
               application/json image/svg+xml text/plain;

    server {
        listen 8080;
        listen [::]:8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # Health checks do not depend on the application state.
        location = /healthz {
            access_log off;
            default_type text/plain;
            add_header Cache-Control "no-store" always;
            add_header X-Content-Type-Options "nosniff" always;
            return 200 "ok\n";
        }

        # The application HTML must be revalidated after a new Docker image is deployed.
        location = /index.html {
            add_header Cache-Control "no-cache" always;
            add_header X-Content-Type-Options "nosniff" always;
            try_files $uri =404;
        }

        # Trunk output uses content-hashed names such as materialcraft-web-<hash>_bg.wasm.
        # Never apply immutable caching to unversioned files.
        location ~* "^/[^/]+-[0-9a-f]{8,}(_bg)?\.(wasm|js|css)$" {
            types { application/wasm wasm; text/javascript js; text/css css; }
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header X-Content-Type-Options "nosniff" always;
            try_files $uri =404;
        }

        # Fallback for unhashed WASM / JS, if upstream changes the file naming scheme.
        location ~* \.(wasm|js)$ {
            types { application/wasm wasm; text/javascript js; }
            add_header Cache-Control "no-cache" always;
            add_header X-Content-Type-Options "nosniff" always;
            try_files $uri =404;
        }

        # No SPA rewrite for missing files: a 404 is safer than returning HTML as WASM.
        location / {
            add_header X-Content-Type-Options "nosniff" always;
            try_files $uri $uri/ =404;
        }
    }
}
